    <!-- Copied and modified from the minimaJake theme under the MIT License (same as in the coffeebisquit repo but doesn't have the coffeebisquit line):
     https://github.com/JakeSteam/minimaJake/blob/99071684c7a4c85418af8db112509eb3388670fc/search.md -->
<!-- Copied and modified from minimaJake under the MIT License (same as in the coffeebisquit repo but doesn't have the coffeebisquit line):
     https://github.com/JakeSteam/minimaJake/blob/99071684c7a4c85418af8db112509eb3388670fc/_includes/custom/search.html -->
<!-- TODO: figure out how to fix the layout when there's only one result. -->
<form id="searchform">
<p>
<input
type="search"
id="search-input"
class="form-control"
name="q"
value=""
autofocus
/>
</p>
</form>
<!-- Added noscript thing so everyone knows it needs JS. -->
<p><noscript class="noscript">Search requires JS, sorry.</noscript></p>
<ul id="searchresults" class="post-list"></ul>
<!-- Modified the path to the script and the posts.json file below. -->
<script src="/assets/js/simplejekyllsearch/search.js" type="text/javascript"></script>
<script>
var sjs = SimpleJekyllSearch({
    searchInput: document.getElementById("searchform"),
                             resultsContainer: document.getElementById("searchresults"),
                             json: "/assets/js/simplejekyllsearch/posts.json",
                             templateMiddleware: function (prop, value, template) {
                                 if (prop === "title" || prop === "excerpt") {
                                     value = value.replace(/&amp;/g, "&");
                                 }
                                 if (prop === "url") {
                                     return value;
                                 }
                                 return value.replace(
                                     new RegExp(document.getElementById("search-input").value, "gi"),
                                                      '<span class="highlight">$&</span>'
                                 );
                             },
                             sortMiddleware: function (a, b) {
                                 aPrio = matchPriority(a.matchedField);
                                 bPrio = matchPriority(b.matchedField);
                                 return bPrio - aPrio;
                             },
                             searchResultTemplate:
                             "<br>"+
                             "<li class='card'>" +
                             "<div class='content'>" +
                             "<a class='post-link' href='{url}'>{title}</a>" +
                             "<span class='post-meta'>{date} • {tags}</span>" +
                             "</div>" +
                             "</li>",
});
// Note that in the search result template above, I had to add line breaks into it so the search results didn't get smushed together.
// I also removed the description since it makes it more messy and makes it harder to content warn videos, but it will still search the
// description.
// TODO: list channel and show thumbnail on search results.

function matchPriority(fieldMatched) {
    switch (fieldMatched) {
        case "tags":
            return 5;
        case "title":
            return 4;
        case "excerpt":
            return 3;
        default:
            return 0;
    }
}

window.addEventListener(
    "load",
    function () {
        var searchParam = new URLSearchParams(window.location.search).get("q");
        if (searchParam != null) {
            document.getElementById("search-input").value = searchParam;
            setTimeout(() => {
                sjs.search(searchParam);
            }, 100);
        }
        document.getElementById("search-input").placeholder =
        "Type your search here...";
    },
    false
);
</script>
