# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: coffeebisquit example website
#email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  This is an example website for coffeebisquit.
baseurl: "" # the subpath of your site, e.g. /blog TODO/FIXME: support the baseurl and url properties correctly; coffeebisquit currently doesn't work right with them.
url: "" # the base hostname & protocol for your site, e.g. http://example.com
mastodon:
  - username: DrewNaylor
    instance: mastodon.online

# We have to say if comments are enabled on this website
# so that they can be turned on and off site-wide.
# Comments on the example website are turned off since I have no GTS instance for it yet.
comments-enabled: false

# gts-conduit is used to get comments from a GoToSocial instance.
#gts-conduit-instance: "http://localhost:4242"

# gts-instance is the GoToSocial instance used by the accounts on this website.
#gts-instance: "http://localhost:8080"

# Build settings
theme: coffeebisquit

# I use CommonMark for stuff like auto-linking
# NOTE: If you enable "DoPeertubeRedirects" in the peertube-imports script, you'll need the
#       "jekyll-redirect-from" plugin, and using it will make the Jekyll build time go up a lot
#       if you have a lot of pages to redirect unfortunately.
plugins:
  - jekyll-seo-tag
  - jekyll-commonmark
  - jekyll-redirect-from
markdown: CommonMark

# Descriptions use HTML <br> items in them for line breaks which works even though the automated version looks bad,
# but you have to enable "UNSAFE" for commonmark in your _config.yml:
# https://github.com/jekyll/jekyll-commonmark/issues/24#issuecomment-460695465
commonmark:
  options: ["UNSAFE"]
  extensions: ["strikethrough", "autolink"]
  
