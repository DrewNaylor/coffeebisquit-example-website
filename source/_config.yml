#     tag: '/tags/:name/'
#     category: '/category/:name/'
  
# Collections for channels and playlists:
# see: https://jekyllrb.com/docs/collections/
# Playlists have a permalink format to make them more predictable
# and that uses the "slug" property in the playlist file.
# see here: https://jekyllrb.com/docs/permalinks/#collections
collections:
  channels:
    output: true
  playlists:
    output: true
    permalink: /:collection/:title
  categories:
    output: true
    
# Set defaults for collections:
# https://jekyllhub.com/tutorial/2026/02/04/jekyll-collections-guide/
# NOTE: by setting each category to default to the "category-page"
#       layout, this allows each category file to only have to have
#       its filename be set in order to have a new or renamed category
#       since each category uses the "slug", or the part of the filename
#       without the extension and the rest of the path, to see if it's
#       the correct category to show a given video.
defaults:
  - scope:
      path: ""
      type: "categories"
    values:
      layout: "category-page"

